<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI GitHub Learning Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">LEARNING DASHBOARD</p>
      <h1>เรียนรู้ GitHub และ AI อย่างเป็นระบบ</h1>
      <p class="sub">บันทึกหัวข้อการเรียนรู้ ลิงก์ GitHub และสิ่งที่ต้องลงมือทำไว้ในเบราว์เซอร์ของคุณ</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">เพิ่ม learning item</h2>
      <form id="item-form" autocomplete="off">
        <input id="item-id" type="hidden">
        <div class="form-grid">
          <label>
            Title
            <input id="item-title" type="text" maxlength="200" required placeholder="เช่น เข้าใจ Pull Request">
          </label>
          <label>
            Category
            <input id="item-category" type="text" maxlength="80" required placeholder="เช่น GitHub, AI, Git">
          </label>
          <label>
            Status
            <select id="item-status">
              <option value="not-started">ยังไม่เริ่ม</option>
              <option value="in-progress">กำลังเรียน</option>
              <option value="completed">เรียนจบแล้ว</option>
            </select>
          </label>
          <label>
            GitHub URL
            <input id="item-github-url" type="url" maxlength="500" placeholder="https://github.com/...">
          </label>
          <label class="full-width">
            Notes
            <textarea id="item-notes" maxlength="1000" rows="3" placeholder="สรุปสิ่งที่ต้องจำหรือขั้นตอนถัดไป"></textarea>
          </label>
        </div>
        <div class="form-actions">
          <button id="cancel-edit" class="secondary" type="button" hidden>ยกเลิกการแก้ไข</button>
          <button type="submit">บันทึก learning item</button>
        </div>
      </form>
    </section>

    <section class="toolbar" aria-label="ค้นหาและกรอง learning items">
      <label class="search">
        <span class="sr-only">ค้นหา</span>
        <input id="search-input" type="search" placeholder="ค้นหาจาก title, category หรือ notes">
      </label>
      <label>
        <span class="sr-only">กรองตามสถานะ</span>
        <select id="status-filter">
          <option value="all">ทุกสถานะ</option>
          <option value="not-started">ยังไม่เริ่ม</option>
          <option value="in-progress">กำลังเรียน</option>
          <option value="completed">เรียนจบแล้ว</option>
        </select>
      </label>
      <label>
        <span class="sr-only">กรองตามหมวดหมู่</span>
        <select id="category-filter">
          <option value="all">ทุกหมวดหมู่</option>
        </select>
      </label>
    </section>

    <div class="list-heading">
      <h2>รายการเรียนรู้</h2>
      <span id="count" aria-live="polite"></span>
    </div>
    <ul id="list" aria-live="polite"></ul>
    <p id="empty-state" class="empty" hidden>ยังไม่พบ learning item ที่ตรงกับเงื่อนไข</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
