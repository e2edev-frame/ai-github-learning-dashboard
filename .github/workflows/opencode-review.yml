name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: |
      github.actor != 'opencode-agent[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # reviewed immutable commit
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Review this pull request:
            Communicate the review findings and summary in clear, concise Thai.
            Use Thai for the pull request title and description when creating or
            updating them. Keep code identifiers, file names, commands, branch
            names, and standard technical terms unchanged.
            - Check for code quality issues
            - Look for potential bugs
            - Flag committed build artifacts (__pycache__, node_modules, dist) or secrets
            - Suggest improvements concisely
